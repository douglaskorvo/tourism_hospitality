# Style configuration for the analysis scripts.
#
# The code targets PEP 8 at its default 79-character limit. Two deliberate
# exceptions are marked inline with `noqa` rather than relaxed globally, so
# that a clean run of the checker stays a meaningful signal.
#
# E402: a few modules put the script directory on sys.path before importing
# their siblings, so those imports cannot sit at the top of the file.
#
# E501: a few regular-expression literals in lexicon.py and some formatted
# print statements would be harder to read if broken across lines.
#
# Run: python -m pycodestyle scripts/*.py

[pycodestyle]
max-line-length = 79
statistics = True

[flake8]
max-line-length = 79
extend-ignore = W503, W504
exclude = .git,__pycache__
